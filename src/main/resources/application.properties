spring.application.name=pesabook

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pesabook}
spring.datasource.username=${DATABASE_USER:pesabook}
spring.datasource.password=${DATABASE_PASSWORD:pesabook}

# Flyway owns the schema. Hibernate is told to validate what it finds and never
# to alter it, so a mismatch between the entities and the migrations fails at
# startup instead of quietly reshaping a table holding money.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
server.port=${PORT:8080}

# How long a key stays claimed by an in flight request before another attempt
# may take it over. Long enough to outlast a slow request, short enough that a
# crashed one does not block a retry for long.
pesabook.idempotency.lock-seconds=${IDEMPOTENCY_LOCK_SECONDS:60}

# Risk thresholds. Deliberately configurable: the right numbers depend on the
# corridor and are not a property of the code.
pesabook.risk.velocity.window-minutes=${RISK_VELOCITY_WINDOW_MINUTES:10}
pesabook.risk.velocity.review-threshold=${RISK_VELOCITY_REVIEW:5}
pesabook.risk.velocity.block-threshold=${RISK_VELOCITY_BLOCK:10}
pesabook.risk.amount.review-minor=${RISK_AMOUNT_REVIEW_MINOR:5000000}
pesabook.risk.amount.multiple-of-median=${RISK_AMOUNT_MULTIPLE:10}
pesabook.risk.new-recipient.review-minor=${RISK_NEW_RECIPIENT_REVIEW_MINOR:1000000}
