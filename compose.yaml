# Brings up PostgreSQL, Redis and the service together for local use.
#
#   docker compose up --build
#
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pesabook
      POSTGRES_USER: pesabook
      POSTGRES_PASSWORD: pesabook
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pesabook"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  pesabook:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/pesabook
      DATABASE_USER: pesabook
      DATABASE_PASSWORD: pesabook
      REDIS_HOST: redis
    ports:
      - "8080:8080"
